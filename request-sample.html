</head>

    <!-- Header / Navigation -->

            </a>

            <nav class="main-nav" aria-label="Main Navigation">

        </div>
    </header>

    <!-- 申请样品标题 -->
    <div class="request-header">
        <h1>申请样品</h1>
    </div>

    <main>
        <!-- 申请样品流程 -->
        <section class="request-process-section">
            <div class="container">
                <div class="process-steps">
                    <div class="process-step">
                        <div class="step-icon">
                            <img src="images/step1-icon.svg" alt="步骤1">
                        </div>
                        <h3>步骤 1</h3>
                        <p>在下方填写表单申请样品</p>
                    </div>
                    <div class="process-step">
                        <div class="step-icon">
                            <img src="images/step2-icon.svg" alt="步骤2">
                        </div>
                        <h3>步骤 2</h3>
                        <p>我们将手动审核您的订单及公司资质，之后会通过电话与您联系</p>
                    </div>
                    <div class="process-step">
                        <div class="step-icon">
                            <img src="images/step3-icon.svg" alt="步骤3">
                        </div>
                        <h3>步骤 3</h3>
                        <p>我们将发送您订购的样品或亲自送达，为您提供最佳的规划建议</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 申请表单 -->
        <section class="request-form-section">
            <div class="container">
                <form id="sampleRequestForm" class="sample-request-form" action="https://formsubmit.co/53ee2d75d679a9d7a7c5ed9b7a711d74" method="POST">
                    <!-- FormSubmit配置 -->
                    <input type="hidden" name="_subject" value="样品申请表单">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_template" value="table">
                    <input type="hidden" name="_next" value="thank-you.html">
                    <!-- 不使用自动回复 -->
                    
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="firstName">名字</label>
                            <input type="text" id="firstName" name="firstName" placeholder="例如：张" required>
                        </div>
                        <div class="form-group half">
                            <label for="lastName">姓氏 <span class="required">*</span></label>
                            <input type="text" id="lastName" name="lastName" placeholder="例如：三" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="company">公司 <span class="required">*</span></label>
                        <input type="text" id="company" name="company" placeholder="例如：老家新有限公司" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="streetAddress">街道地址 <span class="required">*</span></label>
                        <input type="text" id="streetAddress" name="streetAddress" placeholder="例如：北京路123号" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="apartment">公寓、套房等</label>
                        <input type="text" id="apartment" name="apartment" placeholder="">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="city">城市 <span class="required">*</span></label>
                            <input type="text" id="city" name="city" placeholder="例如：上海" required>
                        </div>
                        <div class="form-group half">
                            <label for="province">省/自治区</label>
                            <input type="text" id="province" name="province" placeholder="例如：上海市">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="zipCode">邮政编码 <span class="required">*</span></label>
                            <input type="text" id="zipCode" name="zipCode" placeholder="例如：200000" required>
                        </div>
                        <div class="form-group half">
                            <label for="country">国家 <span class="required">*</span></label>
                            <select id="country" name="country" required>
                                <option value="">选择国家</option>
                                <option value="China">中国</option>
                                <option value="Germany">德国</option>
                                <option value="USA">美国</option>
                                <option value="UK">英国</option>
                                <option value="Japan">日本</option>
                                <option value="South Korea">韩国</option>
                                <option value="Other">其他</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="email">电子邮箱 <span class="required">*</span></label>
                            <input type="email" id="email" name="email" placeholder="例如：name@company.com" required>
                        </div>
                        <div class="form-group half">
                            <label for="phone">电话 <span class="required">*</span></label>
                            <input type="tel" id="phone" name="phone" placeholder="例如：+86 123 4567 8901" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="website">网站 <span class="required">*</span></label>
                        <input type="url" id="website" name="website" placeholder="例如：http://www.example.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="companySize">公司规模 <span class="required">*</span></label>
                        <select id="companySize" name="companySize" required>
                            <option value="">选择选项</option>
                            <option value="1-10">1-10名员工</option>
                            <option value="11-50">11-50名员工</option>
                            <option value="51-200">51-200名员工</option>
                            <option value="201-500">201-500名员工</option>
                            <option value="501-1000">501-1000名员工</option>
                            <option value="1001+">1000名以上员工</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">需求描述</label>
                        <textarea id="message" name="message" rows="4" placeholder="请描述您的需求和感兴趣的产品..."></textarea>
                    </div>
                    
                    <div class="form-group privacy-policy">
                        <label class="checkbox-container">
                            <input type="checkbox" id="privacy" name="privacy" required>
                            <span class="checkmark"></span>
                            <span class="policy-text">我已阅读并同意<a href="#" target="_blank">隐私政策</a>和<a href="#" target="_blank">服务条款</a>。 <span class="required">*</span></span>
                        </label>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">立即申请样品</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

                <span class="footer-divider">|</span>
                <a href="#">版权</a>
            </nav>
            <p class="copyright">©LOR – 2024</p>
        </div>

    <!-- 成功提交弹窗 -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                </svg>
            </div>
            <h3 class="modal-title">申请成功！</h3>
            <p class="modal-text">您的样品申请已成功提交。我们将尽快与您联系。</p>
            <button class="modal-btn" onclick="closeModal()">确定</button>
        </div>
    </div>

    <script src="js/request-sample.js"></script>
