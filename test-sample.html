<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>测试样品申请</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #2070c4; color: white; padding: 12px 30px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>测试样品申请表单（简化版）</h1>
    <p>这是一个简化版的表单，用于测试是否能收到邮件</p>
    
    <form action="https://formsubmit.co/contact@old-home-new.com" method="POST">
        <input type="hidden" name="_subject" value="测试-样品申请表单-简化版">
        <input type="hidden" name="_captcha" value="false">
        
        <div class="form-group">
            <label>姓名：</label>
            <input type="text" name="name" required>
        </div>
        
        <div class="form-group">
            <label>邮箱：</label>
            <input type="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label>公司：</label>
            <input type="text" name="company" required>
        </div>
        
        <div class="form-group">
            <label>电话：</label>
            <input type="tel" name="phone" required>
        </div>
        
        <div class="form-group">
            <label>地址：</label>
            <input type="text" name="address" required>
        </div>
        
        <div class="form-group">
            <label>城市：</label>
            <input type="text" name="city" required>
        </div>
        
        <div class="form-group">
            <label>国家：</label>
            <select name="country" required>
                <option value="">选择国家</option>
                <option value="China">中国</option>
                <option value="Germany">德国</option>
                <option value="USA">美国</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>需求描述：</label>
            <textarea name="message" rows="4"></textarea>
        </div>
        
        <button type="submit">提交测试</button>
    </form>
</body>
</html>
