<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>测试 - 完全复制联系表单</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #2070c4; color: white; padding: 12px 30px; border: none; cursor: pointer; }
        .checkbox-container { display: flex; align-items: center; }
    </style>
</head>
<body>
    <h1>测试表单 - 完全复制联系表单配置</h1>
    <p>这个表单使用和联系表单完全相同的配置</p>
    
    <form action="https://formsubmit.co/contact@old-home-new.com" method="POST">
        <!-- 完全复制联系表单的配置 -->
        <input type="hidden" name="_subject" value="测试-申请样品表单">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        
        <div class="form-group">
            <label for="name">姓名</label>
            <input type="text" id="name" name="name" placeholder="您的姓名" required>
        </div>
        
        <div class="form-group">
            <label for="email">邮箱 *</label>
            <input type="email" id="email" name="email" placeholder="您的邮箱" required>
        </div>
        
        <div class="form-group">
            <label for="company">公司</label>
            <input type="text" id="company" name="company" placeholder="您的公司" required>
        </div>
        
        <div class="form-group">
            <label for="message">留言 *</label>
            <textarea id="message" name="message" placeholder="我们如何帮助您？" required></textarea>
        </div>
        
        <div class="form-group">
            <label class="checkbox-container">
                <input type="checkbox" id="privacy" name="privacy" value="已同意" required>
                <span>我已阅读隐私政策并同意传输和处理我的数据。 *</span>
            </label>
        </div>
        
        <button type="submit">发送请求</button>
    </form>
</body>
</html>
